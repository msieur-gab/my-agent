name: Publish site

# Builds the site and puts the result on the gh-pages branch.
# GitHub Pages serves that branch (Settings → Pages → Deploy from a branch → gh-pages / root).

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build the site
        env:
          BASE_PATH: /my-agent
          BASE_URL: https://msieur-gab.github.io/my-agent
        run: python3 build/build.py
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check matching and redaction
        run: node tests/check.js
      - name: Push the built site to gh-pages
        run: |
          cd public
          git init -q -b gh-pages
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A
          git commit -q -m "Site built from ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
